# FakeActiveUser configuration
# Lines starting with # or ; are comments.

# DisplayMode: where the application presents itself.
# Valid values: Taskbar, SystemTray
DisplayMode=Taskbar

# QuitKeys: the key (or key combination) that closes the app.
# Use "+" to combine modifiers with a key, e.g. Ctrl+Shift+Q. Spaces are ignored.
# Modifiers: Ctrl (or Control), Shift, Alt.
# Main key: any name from System.Windows.Forms.Keys, e.g. Escape, F12, End, Q.
# Full list: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys
QuitKeys=Escape
