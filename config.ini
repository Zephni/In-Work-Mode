# FakeActiveUser configuration
# Lines starting with # or ; are comments.

# DisplayMode: where the application presents itself.
# Valid values: Taskbar, SystemTray
DisplayMode=Taskbar

# QuitKey: the key that closes the app.
# Valid values: any name from System.Windows.Forms.Keys, e.g. Escape, F12, End, Pause.
# Full list: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys
QuitKey=Escape
