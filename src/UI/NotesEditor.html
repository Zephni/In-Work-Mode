<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="vditor/dist/index.css">
    <style>
        html, body, #editor { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { background: #2c3038; }
        .vditor { border-color: #3a3f48; border-radius: 3px; }
        .vditor-toolbar {
            border-color: #3a3f48 !important;
            background: #22252b !important;
            padding: 0 !important;
        }
        .vditor-content { background: #2c3038 !important; }
        .vditor-wysiwyg { padding: 0 !important; }
        .vditor-wysiwyg pre.vditor-reset { padding: 12px 14px !important; }
        .vditor-wysiwyg .vditor-reset ul,
        .vditor-wysiwyg .vditor-reset ol { padding-left: 1.5em; }
        .vditor-wysiwyg .vditor-reset li + li { margin-top: 0; }
        .vditor-wysiwyg .vditor-reset li p { margin: 0; }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="vditor/dist/index.min.js"></script>
    <script>
        let loading = true;
        const editor = new Vditor('editor', {
            mode: 'wysiwyg',
            height: '100%',
            lang: 'en_US',
            theme: 'dark',
            icon: 'material',
            cache: { enable: false },
            cdn: new URL('vditor', document.baseURI).href.replace(/\/$/, ''),
            toolbar: [
                'headings', 'bold', 'italic', 'strike', '|',
                'list', 'ordered-list', 'check', 'outdent', 'indent', '|',
                'quote', 'inline-code', 'code', 'link', '|', 'undo', 'redo'
            ],
            preview: {
                theme: { current: 'dark' },
                hljs: { enable: false }
            },
            input: value => {
                if (!loading) window.chrome.webview.postMessage('change\n' + value);
            },
            after: () => {
                const editorElement = document.getElementById('editor');
                editorElement.addEventListener('paste', event => {
                    const target = event.target instanceof Element ? event.target : event.target.parentElement;
                    const focusNode = window.getSelection().focusNode;
                    const focusElement = focusNode instanceof Element ? focusNode : focusNode && focusNode.parentElement;
                    if (!target.closest('.vditor-wysiwyg [contenteditable="true"]') ||
                        target.closest('code, .vditor-panel') ||
                        (focusElement && focusElement.closest('code'))) return;
                    const url = event.clipboardData.getData('text/plain').trim();
                    if (!/^https:\/\/\S+$/.test(url)) return;
                    try {
                        if (new URL(url).protocol !== 'https:') return;
                    } catch {
                        return;
                    }
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    const label = url.replace(/[\\[\]]/g, '\\$&');
                    const destination = url.replace(/[<>]/g, character => encodeURIComponent(character));
                    editor.insertMD('[' + label + '](<' + destination + '>)');
                }, true);
                editorElement.addEventListener('keydown', event => {
                    const selection = window.getSelection();
                    const anchorNode = selection.focusNode;
                    if (!anchorNode) return;
                    const anchorElement = anchorNode.nodeType === Node.ELEMENT_NODE
                        ? anchorNode
                        : anchorNode.parentElement;
                    const listItem = anchorElement.closest('.vditor-wysiwyg li');
                    if (!listItem) return;

                    if (event.key === 'Home' && !event.ctrlKey && !event.altKey && !event.metaKey) {
                        const walker = document.createTreeWalker(listItem, NodeFilter.SHOW_TEXT, {
                            acceptNode: node => node.parentElement.closest('li') === listItem && /\S/.test(node.textContent)
                                ? NodeFilter.FILTER_ACCEPT
                                : NodeFilter.FILTER_REJECT
                        });
                        const firstText = walker.nextNode();
                        const target = firstText || listItem.querySelector('p') || listItem;
                        const offset = firstText ? firstText.textContent.search(/\S/) : target.childNodes.length;
                        event.preventDefault();
                        event.stopImmediatePropagation();
                        if (event.shiftKey) {
                            selection.extend(target, offset);
                        } else {
                            selection.collapse(target, offset);
                        }
                        return;
                    }
                    if (event.key !== 'Tab') return;

                    if (selection.isCollapsed) {
                        const range = selection.getRangeAt(0);
                        range.setStart(listItem, 0);
                        range.collapse(true);
                    }
                }, true);
                window.chrome.webview.postMessage('ready');
            }
        });

        window.chrome.webview.addEventListener('message', event => {
            const message = event.data;
            if (message.startsWith('load\n')) {
                editor.setValue(message.substring(5), true);
                loading = false;
                editor.focus();
            } else if (message.startsWith('insert\n')) {
                editor.insertValue(message.substring(7));
                editor.focus();
            }
        });
    </script>
</body>
</html>
